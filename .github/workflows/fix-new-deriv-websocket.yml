name: Fix new Deriv WebSocket flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[deriv-flow-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace WebSocket connection method
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/services/derivWebSocket.ts')
          text = path.read_text()

          start = text.index('  private openSocket(generation: number) {')
          end = text.index('  private scheduleReconnect(generation: number) {', start)

          replacement = r'''  private openSocket(generation: number) {
    if (generation !== this.connectGeneration || this.intentionallyClosed) return;

    const requestAuthenticatedUrl = async (): Promise<{ url: string; accountId?: string }> => {
      const response = await fetch('/.netlify/functions/deriv-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ accountId: this.cachedLoginId || undefined }),
        cache: 'no-store',
      });

      const body = await response.text();
      let data: any;
      try {
        data = JSON.parse(body);
      } catch {
        throw new Error(body || `OTP request failed (${response.status})`);
      }

      if (!response.ok || !data?.url) {
        throw new Error(data?.error || data?.details || `OTP request failed (${response.status})`);
      }

      return { url: String(data.url), accountId: data.accountId ? String(data.accountId) : undefined };
    };

    requestAuthenticatedUrl()
      .then(({ url, accountId }) => {
        if (generation !== this.connectGeneration || this.intentionallyClosed) return;

        this.activeEndpointUrl = url;
        if (accountId) this.cachedLoginId = accountId;

        const ws = new WebSocket(url);
        this.ws = ws;

        ws.onopen = () => {
          if (generation !== this.connectGeneration || ws !== this.ws) {
            try { ws.close(); } catch (_) {}
            return;
          }

          this.isConnected = true;
          this.isAuthorized = true;
          this.reconnectAttempts = 0;

          console.info('[Deriv WS] Authenticated WebSocket connected:', this.activeEndpointUrl);

          this.notifyAuth({
            isAuthorized: true,
            loginid: this.cachedLoginId,
            email: this.cachedEmail,
            currency: this.currency,
            isVirtual: this.cachedIsVirtual,
            appId: this.appId,
            activeEndpoint: this.activeEndpointUrl,
            error: null,
          });

          // The OTP URL is already authenticated. Do NOT send the Bearer token over WebSocket.
          ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
          ws.send(JSON.stringify({ get_settings: 1 }));
          this.activeSubscriptions.forEach((symbol) => this.sendTickSubscription(symbol));
        };

        ws.onmessage = (event) => {
          if (generation !== this.connectGeneration || ws !== this.ws) return;
          try {
            this.handleMessage(JSON.parse(event.data));
          } catch (error) {
            console.error('[Deriv WS] Invalid JSON message:', error);
          }
        };

        ws.onerror = () => {
          if (generation !== this.connectGeneration || ws !== this.ws) return;
          console.error('[Deriv WS] Authenticated WebSocket error.');
          this.isConnected = false;
          this.isAuthorized = false;
          this.notifyAuth({
            isAuthorized: false,
            appId: this.appId,
            activeEndpoint: this.activeEndpointUrl,
            error: 'Authenticated Deriv WebSocket error.',
          });
        };

        ws.onclose = (event) => {
          if (generation !== this.connectGeneration || ws !== this.ws) return;

          this.ws = null;
          this.isConnected = false;
          this.isAuthorized = false;

          console.warn(`[Deriv WS] Connection closed. code=${event.code} reason=${event.reason || 'none'}`);

          if (!this.intentionallyClosed && this.token) {
            this.notifyAuth({
              isAuthorized: false,
              appId: this.appId,
              activeEndpoint: this.activeEndpointUrl,
              error: `Deriv WebSocket connection closed. Code: ${event.code} Reason: ${event.reason || 'none'}`,
            });
            this.scheduleReconnect(generation);
          }
        };
      })
      .catch((error) => {
        if (generation !== this.connectGeneration || this.intentionallyClosed) return;
        this.isConnected = false;
        this.isAuthorized = false;
        const message = error instanceof Error ? error.message : String(error);
        console.error('[Deriv WS] Failed to obtain authenticated WebSocket URL:', message);
        this.notifyAuth({
          isAuthorized: false,
          appId: this.appId,
          activeEndpoint: this.activeEndpointUrl,
          error: message,
        });
        if (this.token) this.scheduleReconnect(generation);
      });
  }

'''

          path.write_text(text[:start] + replacement + text[end:])
          print('patched', path)
          PY

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/derivWebSocket.ts
          git commit -m 'Fix Deriv authenticated WebSocket flow [deriv-flow-fixed]'
          git push

      - name: Remove temporary patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-new-deriv-websocket.yml
          git commit -m 'Remove temporary Deriv patch workflow [deriv-flow-fixed]'
          git push
